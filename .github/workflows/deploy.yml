# ─────────────────────────────────────────────────────────────────────────────
# ForceOrg-40k — Production Deployment Pipeline (§2.1)
# Lint, test, build, and publish API container to GHCR
# ─────────────────────────────────────────────────────────────────────────────

name: Production Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/db-client/prisma/schema.prisma

      - name: Code Quality Audits
        run: |
          npm run lint
          npm run test:coverage --prefix packages/rules-engine-11e

      - name: Build Application Artifacts
        run: npm run build

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/forceorg-api:latest
            ghcr.io/${{ github.repository }}/forceorg-api:${{ github.sha }}

      - name: Build and Push Web Image to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/forceorg-web:latest
            ghcr.io/${{ github.repository }}/forceorg-web:${{ github.sha }}
