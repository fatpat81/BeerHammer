# BeerHammer — Supabase CLI config
project_id = "wvlemknyhjcskozhlsru"

# Browsers call these with the publishable key, which is not a JWT,
# so Supabase's default JWT check must be off. The functions do their own
# validation, rate limiting, and lockout.
[functions.auth-signup]
verify_jwt = false

[functions.auth-login]
verify_jwt = false
