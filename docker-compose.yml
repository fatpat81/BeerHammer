# ─────────────────────────────────────────────────────────────────────────────
# ForceOrg-40k — Full Stack Local Development Composition (§4.8)
# Orchestrates Postgres, Express API, Next.js Web Frontend, and MinIO S3 Storage
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: forceorg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: forceorg_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d forceorg_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── SeaweedFS Local S3-Compatible Storage ──────────────────────────────────
  # (MinIO removed its Docker Hub / quay.io images; SeaweedFS is a maintained
  #  drop-in S3 server for local development. S3 endpoint is exposed on 9000.)
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: forceorg-s3
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000
    ports:
      - '9000:9000'
      - '9333:9333'
    volumes:
      - s3_data:/data

  # ── Express API Service ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: forceorg-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The image entrypoint applies pending Prisma migrations before booting.
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/forceorg_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/forceorg_dev?schema=public
      CORS_ORIGIN: http://localhost:3000
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      S3_BUCKET_NAME: forceorg-miniatures
      PUBLIC_CDN_BASE_URL: http://localhost:9000/forceorg-miniatures
    ports:
      - '4000:4000'

  # ── Next.js Web Frontend ──────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: forceorg-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'

  # ── Wahapedia ETL (one-shot; run on demand or schedule on the host) ────────
  # Not started by default. Run a pass:
  #   docker compose run --rm sync-worker
  # or schedule it (cron example, daily 02:00 UTC):
  #   0 2 * * * cd /path/to/BeerHammer && docker compose run --rm sync-worker
  sync-worker:
    build:
      context: .
      dockerfile: Dockerfile.sync-worker
    container_name: forceorg-sync-worker
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/forceorg_dev?schema=public
      DIRECT_URL: postgresql://postgres:postgrespassword@postgres:5432/forceorg_dev?schema=public
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

volumes:
  postgres_data:
  s3_data:
